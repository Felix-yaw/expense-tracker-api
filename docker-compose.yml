services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_PATH: /data/expense_tracker.db
      JWT_SECRET: change-me-in-production
      JWT_TTL: 24h
      CORS_ORIGINS: "*"
    volumes:
      - api-data:/data
    restart: unless-stopped

volumes:
  api-data:
